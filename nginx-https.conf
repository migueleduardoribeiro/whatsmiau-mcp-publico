map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name bots.example.org whatsmiau.example.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name whatsmiau.example.org;
    ssl_certificate /etc/letsencrypt/live/lylahub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lylahub/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;
    location = / { return 302 /painel/; }
    location = /painel { return 308 /painel/; }
    location ^~ /painel/api/ {
        auth_basic "LylaHub WhatsMiau";
        auth_basic_user_file /etc/nginx/exemplo.htpasswd;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8090/;
        proxy_read_timeout 40s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never trust the browser's user header. Only Nginx authenticates this value.
        proxy_set_header X-LylaHub-User $remote_user;
        proxy_set_header Authorization "";
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
    location ^~ /painel/ {
        auth_basic "LylaHub WhatsMiau";
        auth_basic_user_file /etc/nginx/exemplo.htpasswd;
        alias /opt/projeto-exemplo/panel/static/;
        index index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/lylahub-proxy.conf;
    }
}

server {
    listen 443 ssl;
    server_name bots.example.org;
    ssl_certificate /etc/letsencrypt/live/lylahub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lylahub/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Content-Type 'text/plain; charset=utf-8' always;
    return 410 'n8n retirado. Os fluxos agora usam o backend Python LylaHub.\n';
}

server {
    listen 192.0.2.10:8081;
    server_name _;
    access_log off;
    client_max_body_size 256k;
    location ~ "^/webhooks/[A-Za-z0-9_-]{1,100}$" {
        allow 172.29.0.0/16;
        allow 192.0.2.10;
        allow 127.0.0.1;
        deny all;
        limit_except POST { deny all; }
        include /etc/nginx/snippets/lylahub-bots-token.conf;
        proxy_pass http://192.0.2.20:8000;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
    }
    location /v1/ {
        allow 192.0.2.20;
        allow 192.0.2.10;
        deny all;
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
    }
    location / { return 404; }
}
