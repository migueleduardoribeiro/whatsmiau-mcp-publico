map $request_uri $lylahub_mcp_fetch_uri {
    ~^/(?:openai|openai-brazilsouth|openai-blob-brazilsouth|whatsapp)(/.*)$ $1;
    default "";
}
server {
    listen 127.0.0.1:8092;
    server_name _;
    access_log off;
    error_log /dev/null crit;
    include /etc/nginx/snippets/lylahub-mcp-fetch-auth.conf;
    client_max_body_size 1k;
    if ($http_x_lylahub_fetch_ip !~ "^[0-9]{1,3}(\.[0-9]{1,3}){3}$") { return 400; }
    location ^~ /openai/ {
        limit_except GET { deny all; }
        proxy_pass https://$http_x_lylahub_fetch_ip$lylahub_mcp_fetch_uri;
        proxy_set_header Host files.oaiusercontent.com;
        proxy_ssl_server_name on;
        proxy_ssl_name files.oaiusercontent.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location ^~ /openai-brazilsouth/ {
        limit_except GET { deny all; }
        proxy_pass https://$http_x_lylahub_fetch_ip$lylahub_mcp_fetch_uri;
        proxy_set_header Host sdmntprbrazilsouth.oaiusercontent.com;
        proxy_ssl_server_name on;
        proxy_ssl_name sdmntprbrazilsouth.oaiusercontent.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location ^~ /openai-blob-brazilsouth/ {
        limit_except GET { deny all; }
        proxy_pass https://$http_x_lylahub_fetch_ip$lylahub_mcp_fetch_uri;
        proxy_set_header Host oaisdmntprbrazilsouth.blob.core.windows.net;
        proxy_ssl_server_name on;
        proxy_ssl_name oaisdmntprbrazilsouth.blob.core.windows.net;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location ^~ /whatsapp/ {
        limit_except GET { deny all; }
        proxy_pass https://$http_x_lylahub_fetch_ip$lylahub_mcp_fetch_uri;
        proxy_set_header Host mmg.whatsapp.net;
        proxy_ssl_server_name on;
        proxy_ssl_name mmg.whatsapp.net;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Origin https://web.whatsapp.com;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location / { return 404; }
}